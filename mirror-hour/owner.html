<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner desk · Mirror Hour Salon</title>
<meta name="theme-color" content="#150a18">
<link rel="manifest" href="owner.webmanifest">
<link rel="icon" href="icons/owner-192.png"><link rel="apple-touch-icon" href="icons/owner-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<main id="login" class="login wrap">
  <h1>🪞 Owner desk</h1>
  <p style="color:var(--mut)">Mirror Hour Salon &amp; Studio. Sales, bookings, services, stylists and offers.</p>
  <form id="lf" class="card" autocomplete="off">
    <label for="pw">Owner password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div id="lmsg" class="msg" role="alert"></div>
    <button class="btn" type="submit" style="width:100%">Log in</button>
    <div id="demohint" class="hint" hidden></div>
  </form>
</main>
<div id="app" hidden>
  <header class="top"><div class="in">
    <div class="brand"><i>🪞</i><div><b>Mirror Hour</b><small>Owner desk</small></div></div>
    <div style="display:flex;gap:8px"><button class="btn sm ghost install" id="inst" type="button">Install app</button><button class="btn sm ghost" id="out" type="button">Log out</button></div>
  </div></header>
  <div class="wrap"><div class="tabs desk" id="dtabs" role="tablist"></div><div id="view"></div></div>
  <nav class="bot" id="bnav"></nav>
</div>
<dialog id="dlg"><div id="dbody"></div></dialog>
<script src="js/seed.js"></script>
<script src="js/core.js"></script>
<script src="js/demo-api.js"></script>
<script src="js/ui.js"></script>
<script src="js/owner.js"></script>
</body>
</html>
